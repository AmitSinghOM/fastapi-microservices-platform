services:
  db:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-webhooks}
      # Development-only default; provide a managed secret outside development.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-webhooks}:${POSTGRES_PASSWORD:-development-only-db-password}@db:5432/${POSTGRES_DB:-webhooks}
      AUTO_CREATE_SCHEMA: "false"
      SECRET_KEY: ${SECRET_KEY:-development-only-jwt-key-change-me-now}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-development-only-api-pepper-change-now}
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-development-only-signing-key-change}
      ALLOW_HTTP_WEBHOOKS: ${ALLOW_HTTP_WEBHOOKS:-true}
      ALLOWED_HOSTS: '["localhost","127.0.0.1","api"]'
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: unless-stopped
  egress-proxy:
    build: deploy/egress-proxy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=13,gid=13,mode=0700
    networks:
      worker-proxy:
        ipv4_address: 172.28.0.2
      outbound: {}
    healthcheck:
      test: ["CMD", "/usr/sbin/squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      # Explicit client configuration; HTTP(S)_PROXY and NO_PROXY are ignored.
      WORKER_EGRESS_PROXY_URL: http://egress-proxy:3128
    depends_on:
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    networks: [backend, worker-proxy]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.27.0.0/24
  worker-proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  outbound:
    ipam:
      config:
        - subnet: 172.29.0.0/24
