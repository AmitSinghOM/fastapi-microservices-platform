[tool.ruff]
target-version = "py311"
line-length = 79
exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
  "app/admission.py",
  "app/config.py",
  "app/retry_policy.py",
  "app/scheduling.py",
  "app/security_observability.py",
  "app/observability.py",
  "app/schemas",
  "app/webhook_security.py",
  "scripts/phase3_dns_server.py",
  "scripts/verify_egress_boundary.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
