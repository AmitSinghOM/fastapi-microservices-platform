name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "action.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "action.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/webhooks_test
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/webhooks_test
      AUTO_CREATE_SCHEMA: "false"
      SECRET_KEY: ci-only-jwt-key-with-at-least-32-characters
      API_KEY_PEPPER: ci-only-api-pepper-with-at-least-32-chars
      WEBHOOK_SIGNING_KEY: ci-only-signing-key-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Compile
        run: python -m compileall -q app migrations scripts
      - name: Test SQLite and PostgreSQL behavior
        run: pytest app/tests -q
      - name: Apply and verify migrations
        run: |
          alembic upgrade head
          alembic check
