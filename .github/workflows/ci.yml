name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "action.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "action.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipped-runtime:
    # The Dockerfile base image is the Python that production runs. Derive
    # the test matrix from it so a base-image bump cannot ship untested.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      versions: ${{ steps.runtime.outputs.versions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: runtime
        name: Read the shipped Python version
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re
          dockerfile = pathlib.Path("Dockerfile").read_text()
          match = re.search(r"^FROM python:(3\.\d+)[.-]", dockerfile, re.M)
          if match is None:
              raise SystemExit("Dockerfile must build FROM python:3.X")
          versions = sorted({match.group(1), "3.12"},
                            key=lambda v: tuple(map(int, v.split("."))))
          print(f"versions={json.dumps(versions)}")
          PY
          cat "$GITHUB_OUTPUT"

  repository-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    needs: shipped-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.shipped-runtime.outputs.versions) }}
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/webhooks_test
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/webhooks_test
      AUTO_CREATE_SCHEMA: "false"
      SECRET_KEY: ci-only-jwt-key-with-at-least-32-characters
      API_KEY_PEPPER: ci-only-api-pepper-with-at-least-32-chars
      WEBHOOK_SIGNING_KEY: ci-only-signing-key-with-at-least-32-chars
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate and install locked runtime
        run: |
          python scripts/check_deployment_lock.py
          python -m pip install --require-hashes -r requirements-deploy.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-deploy.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          mypy
          # worker_client_smoke.py imports app.worker and runs only inside
          # the container harness; it is compiled and lint-checked here.
          mypy tests/egress/test_harness.py tests/egress/tls_fixture.py \
            tests/egress/tls_receiver.py
      - name: Compile
        run: python -m compileall -q app migrations scripts sdk/python/src examples tests/egress
      - name: Test egress harness without Docker
        run: pytest tests/egress -q
      - name: Test SDK and CLI behavior
        run: PYTHONPATH=sdk/python/src pytest sdk/python/tests -q
      - name: Test SQLite and PostgreSQL behavior
        run: pytest app/tests -q
      - name: Apply and verify migrations
        run: |
          alembic upgrade head
          alembic check

  sdk-python-311:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install SDK test dependencies
        run: python -m pip install "./sdk/python[test]"
      - name: Test SDK on Python 3.11
        run: pytest -c sdk/python/pyproject.toml sdk/python/tests -q

  sdk-reproducible-build:
    # The release pipeline restores retained candidates byte-for-byte and
    # rejects any rebuild whose hashes differ from the registry. That only
    # works if two builds of the same commit produce identical bytes, so this
    # job proves it on every push: build twice, several seconds apart and
    # from separate copies, then require equal wheel and sdist hashes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build the SDK twice and compare
        run: |
          python -m pip install build==1.2.2.post1 twine==6.0.1
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          for attempt in 1 2; do
            rm -rf "$RUNNER_TEMP/src-$attempt"
            cp -R sdk/python "$RUNNER_TEMP/src-$attempt"
            python -m build --outdir "$RUNNER_TEMP/dist-$attempt" \
              "$RUNNER_TEMP/src-$attempt"
            python scripts/normalize_sdist.py "$RUNNER_TEMP/dist-$attempt"/*.tar.gz
            (cd "$RUNNER_TEMP/dist-$attempt" && sha256sum -- *.whl *.tar.gz) \
              > "$RUNNER_TEMP/sums-$attempt"
            sleep 3
          done
          cat "$RUNNER_TEMP/sums-1"
          if ! cmp "$RUNNER_TEMP/sums-1" "$RUNNER_TEMP/sums-2"; then
            echo "::error::SDK build is not reproducible; wheel or sdist bytes differ between two builds of the same commit" >&2
            diff "$RUNNER_TEMP/sums-1" "$RUNNER_TEMP/sums-2" || true
            exit 1
          fi
          python -m twine check "$RUNNER_TEMP"/dist-1/*
          echo "Both builds are byte-identical"
