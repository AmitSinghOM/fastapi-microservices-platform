name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed sdk-vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: python-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify signed release tag and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SDK release tag" >&2
            exit 1
          fi
          TAG_OBJECT=$(git rev-parse "$RELEASE_TAG^{tag}")
          VERIFIED=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified')
          if [[ "$VERIFIED" != "true" ]]; then
            echo "SDK release tag is not verified by GitHub" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(
              pathlib.Path("sdk/python/pyproject.toml").read_text()
          )["project"]["version"]
          expected = os.environ["RELEASE_TAG"].removeprefix("sdk-v")
          if version != expected:
              raise SystemExit(f"tag {expected} does not match package {version}")
          PY
      - name: Build and inspect distributions
        run: |
          python -m pip install build==1.2.2.post1 twine==6.0.1
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
      - name: Verify clean wheel installation
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m venv "$RUNNER_TEMP/sdk-smoke"
          "$RUNNER_TEMP/sdk-smoke/bin/python" -m pip install \
            sdk/python/dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/python" -c \
            "from webhook_platform_sdk import AuthClient, Producer, verify_request"
          "$RUNNER_TEMP/sdk-smoke/bin/webhookctl" --help >/dev/null
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: sdk/python/dist/
          skip-existing: false
          verbose: false
