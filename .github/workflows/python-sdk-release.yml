name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed sdk-vMAJOR.MINOR.PATCH tag already released to TestPyPI
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: python-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify signed release tag, commit, CI, and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SDK release tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Dispatch this workflow from the same signed release tag" >&2
            exit 1
          fi
          TAG_OBJECT=$(git rev-parse "$RELEASE_TAG^{tag}")
          RELEASE_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          VERIFIED=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified')
          if [[ "$VERIFIED" != "true" ]]; then
            echo "SDK release tag is not verified by GitHub" >&2
            exit 1
          fi
          COMMIT_VERIFIED=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" \
            --jq '.commit.verification.verified')
          if [[ "$COMMIT_VERIFIED" != "true" ]]; then
            echo "SDK release commit is not verified by GitHub" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "SDK release commit is not contained in origin/main" >&2
            exit 1
          fi
          CI_CONCLUSION=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "branch=main" \
            -f "event=push" \
            -f "head_sha=$RELEASE_COMMIT" \
            -f "per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')
          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "SDK release commit has no successful main-push CI run" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#sdk-v}
          PACKAGE_VERSION=$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(
              pathlib.Path("sdk/python/pyproject.toml").read_text()
          )["project"]["version"])
          PY
          )
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Tag $RELEASE_VERSION does not match package $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Retrieve successful TestPyPI workflow manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RUNS=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/python-sdk-test-release.yml/runs" \
            -f "event=workflow_dispatch" \
            -f "status=success" \
            -f "per_page=100")
          TEST_RUN_ID=$(printf '%s' "$RUNS" | jq -r \
            --arg sha "$RELEASE_COMMIT" \
            --arg branch "$RELEASE_TAG" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)] | sort_by(.created_at) | last | .id // empty')
          if [[ -z "$TEST_RUN_ID" ]]; then
            echo "No successful TestPyPI workflow exists for this tag and commit" >&2
            exit 1
          fi
          ARTIFACTS=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID/artifacts")
          ARTIFACT_NAME="${RELEASE_TAG}-candidate"
          ARTIFACT_COUNT=$(printf '%s' "$ARTIFACTS" | jq \
            --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length')
          if [[ "$ARTIFACT_COUNT" != "1" ]]; then
            echo "Expected exactly one retained TestPyPI candidate artifact" >&2
            exit 1
          fi
          ARTIFACT_ID=$(printf '%s' "$ARTIFACTS" | jq -r \
            --arg name "$ARTIFACT_NAME" \
            '.artifacts[] | select(.name == $name and .expired == false) | .id')
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/testpypi-manifest.zip"
          unzip -p "$RUNNER_TEMP/testpypi-manifest.zip" SHA256SUMS \
            > sdk/python/TESTPYPI_SHA256SUMS
          test -s sdk/python/TESTPYPI_SHA256SUMS
      - name: Download approved cooled TestPyPI artifacts
        run: |
          python scripts/release_registry.py download \
            --repository testpypi \
            --version "$RELEASE_VERSION" \
            --manifest sdk/python/TESTPYPI_SHA256SUMS \
            --dist-dir sdk/python/dist \
            --minimum-age-hours 24
      - name: Inspect and hash promoted distributions
        run: |
          python -m pip install twine==6.0.1
          python -m twine check sdk/python/dist/*
          (
            cd sdk/python/dist
            sha256sum -- *.whl *.tar.gz > ../SHA256SUMS
            sha256sum --check ../SHA256SUMS
            cmp ../SHA256SUMS ../TESTPYPI_SHA256SUMS
            cat ../SHA256SUMS
          )
      - name: Verify clean wheel installation
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m venv "$RUNNER_TEMP/sdk-smoke"
          "$RUNNER_TEMP/sdk-smoke/bin/python" -m pip install \
            sdk/python/dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/python" -c \
            "from webhook_platform_sdk import AuthClient, Producer, verify_request"
          "$RUNNER_TEMP/sdk-smoke/bin/webhookctl" --help >/dev/null
      - name: Retain production hash manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.tag }}-pypi-sha256
          path: sdk/python/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Verify PyPI retry state
        run: |
          python scripts/release_registry.py preflight \
            --repository pypi \
            --version "$RELEASE_VERSION" \
            --dist-dir sdk/python/dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
          verbose: false
      - name: Verify complete PyPI release
        run: |
          python scripts/release_registry.py wait \
            --repository pypi \
            --version "$RELEASE_VERSION" \
            --dist-dir sdk/python/dist \
            --timeout-seconds 300
