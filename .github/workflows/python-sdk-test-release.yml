name: Publish Python SDK to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed sdk-vMAJOR.MINOR.PATCH tag to test
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: python-sdk-test-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify signed release tag, commit, CI, and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SDK release tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Dispatch this workflow from the same signed release tag" >&2
            exit 1
          fi
          TAG_OBJECT=$(git rev-parse "$RELEASE_TAG^{tag}")
          RELEASE_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          VERIFIED=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified')
          if [[ "$VERIFIED" != "true" ]]; then
            echo "SDK release tag is not verified by GitHub" >&2
            exit 1
          fi
          COMMIT_VERIFIED=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" \
            --jq '.commit.verification.verified')
          if [[ "$COMMIT_VERIFIED" != "true" ]]; then
            echo "SDK release commit is not verified by GitHub" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "SDK release commit is not contained in origin/main" >&2
            exit 1
          fi
          CI_CONCLUSION=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "branch=main" \
            -f "event=push" \
            -f "head_sha=$RELEASE_COMMIT" \
            -f "per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')
          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "SDK release commit has no successful main-push CI run" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#sdk-v}
          PACKAGE_VERSION=$(python - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(
              pathlib.Path("sdk/python/pyproject.toml").read_text()
          )["project"]["version"])
          PY
          )
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Tag $RELEASE_VERSION does not match package $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_COMMIT")" >> "$GITHUB_ENV"
      - name: Restore an earlier identical release candidate when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/python-sdk-test-release.yml/runs" \
            -f "event=workflow_dispatch" \
            -f "per_page=100")
          RUN_IDS=$(printf '%s' "$RUNS" | jq -r \
            --arg sha "$RELEASE_COMMIT" \
            --arg branch "$RELEASE_TAG" \
            --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .id != $current)] | sort_by(.created_at) | reverse | .[].id')
          ARTIFACT_NAME="${RELEASE_TAG}-candidate"
          STEM="fastapi_microservices_platform_sdk-${RELEASE_VERSION}"
          for RUN_ID in $RUN_IDS; do
            ARTIFACTS=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")
            ARTIFACT_ID=$(printf '%s' "$ARTIFACTS" | jq -r \
              --arg name "$ARTIFACT_NAME" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | first | .id // empty')
            if [[ -z "$ARTIFACT_ID" ]]; then
              continue
            fi
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              > "$RUNNER_TEMP/release-candidate.zip"
            CANDIDATE_DIR="$RUNNER_TEMP/restored-candidate"
            rm -rf "$CANDIDATE_DIR"
            mkdir -p "$CANDIDATE_DIR/dist"
            if ! unzip -p "$RUNNER_TEMP/release-candidate.zip" \
              "dist/${STEM}-py3-none-any.whl" \
              > "$CANDIDATE_DIR/dist/${STEM}-py3-none-any.whl" \
              || ! unzip -p "$RUNNER_TEMP/release-candidate.zip" \
              "dist/${STEM}.tar.gz" \
              > "$CANDIDATE_DIR/dist/${STEM}.tar.gz" \
              || ! unzip -p "$RUNNER_TEMP/release-candidate.zip" SHA256SUMS \
              > "$CANDIDATE_DIR/SHA256SUMS"; then
              echo "Candidate artifact from workflow run $RUN_ID is malformed"
              continue
            fi
            if ! (
              cd "$CANDIDATE_DIR/dist"
              sha256sum --check ../SHA256SUMS
              sha256sum -- *.whl *.tar.gz > ../CURRENT_SHA256SUMS
            ) || ! cmp \
              "$CANDIDATE_DIR/SHA256SUMS" \
              "$CANDIDATE_DIR/CURRENT_SHA256SUMS"; then
              echo "Candidate artifact from workflow run $RUN_ID is inconsistent"
              continue
            fi
            rm "$CANDIDATE_DIR/CURRENT_SHA256SUMS"
            if python scripts/release_registry.py preflight \
              --repository testpypi \
              --version "$RELEASE_VERSION" \
              --dist-dir "$CANDIDATE_DIR/dist"; then
              mv "$CANDIDATE_DIR/dist" sdk/python/dist
              mv "$CANDIDATE_DIR/SHA256SUMS" sdk/python/SHA256SUMS
              echo "RESTORED_RELEASE_CANDIDATE=true" >> "$GITHUB_ENV"
              echo "Restored matching candidate from workflow run $RUN_ID"
              break
            fi
            echo "Candidate from workflow run $RUN_ID does not match registry state"
          done
      - name: Build and hash new distributions
        if: env.RESTORED_RELEASE_CANDIDATE != 'true'
        run: |
          python -m pip install build==1.2.2.post1
          python -m build sdk/python
          (
            cd sdk/python/dist
            sha256sum -- *.whl *.tar.gz > ../SHA256SUMS
          )
      - name: Inspect and verify release candidate
        run: |
          python -m pip install twine==6.0.1
          python -m twine check sdk/python/dist/*
          (
            cd sdk/python/dist
            sha256sum --check ../SHA256SUMS
            sha256sum -- *.whl *.tar.gz > ../CURRENT_SHA256SUMS
          )
          cmp sdk/python/SHA256SUMS sdk/python/CURRENT_SHA256SUMS
          rm sdk/python/CURRENT_SHA256SUMS
          cat sdk/python/SHA256SUMS
      - name: Verify clean wheel installation
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m venv "$RUNNER_TEMP/sdk-smoke"
          "$RUNNER_TEMP/sdk-smoke/bin/python" -m pip install \
            sdk/python/dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/python" -c \
            "from webhook_platform_sdk import AuthClient, Producer, verify_request"
          "$RUNNER_TEMP/sdk-smoke/bin/webhookctl" --help >/dev/null
      - name: Retain release candidate for retry recovery
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.tag }}-candidate
          path: |
            sdk/python/dist/*
            sdk/python/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Verify TestPyPI retry state
        run: |
          python scripts/release_registry.py preflight \
            --repository testpypi \
            --version "$RELEASE_VERSION" \
            --dist-dir sdk/python/dist
      - name: Publish with TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: sdk/python/dist/
          skip-existing: true
          verbose: false
      - name: Verify complete TestPyPI release
        run: |
          python scripts/release_registry.py wait \
            --repository testpypi \
            --version "$RELEASE_VERSION" \
            --dist-dir sdk/python/dist \
            --timeout-seconds 120
