version: 2
updates:
  # Platform runtime and dev pins. requirements-deploy.txt (the hash lock) is
  # regenerated with `make lock`; the container build fails if a bump to
  # requirements.txt lands without it.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # passlib 1.7.4 reads bcrypt.__about__, which bcrypt 4.1 removed. Moving
      # either needs a tested password-hash migration, not a version bump.
      - dependency-name: "bcrypt"
        versions: [">=4.1"]
      - dependency-name: "passlib"
      # SQLAlchemy 2.1 is a feature release with its own migration notes.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
  # The SDK's pins are its published dependency contract, so only security
  # updates (limit 0 disables routine version PRs).
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: "/examples/receiver"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      receiver-example:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      container-images:
        patterns: ["*"]
    ignore:
      # Digest refreshes within python:3.11 still arrive. A Python minor
      # change needs its own tested migration.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: docker
    directory: "/deploy/egress-proxy"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
