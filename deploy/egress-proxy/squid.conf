# CONNECT-only TLS tunnel. Squid resolves and checks destinations itself.
http_port 3128
visible_hostname webhook-egress-proxy
pid_filename /tmp/squid.pid
coredump_dir /tmp

acl worker_clients src 172.28.0.0/24
acl connect_method method CONNECT
acl tls_port port 443

# IPv4 special-purpose, private, metadata, cluster, and reserved ranges.
acl denied_destination dst 0.0.0.0/8
acl denied_destination dst 10.0.0.0/8
acl denied_destination dst 100.64.0.0/10
acl denied_destination dst 127.0.0.0/8
acl denied_destination dst 169.254.0.0/16
acl denied_destination dst 172.16.0.0/12
acl denied_destination dst 192.0.0.0/24
acl denied_destination dst 192.0.2.0/24
acl denied_destination dst 192.31.196.0/24
acl denied_destination dst 192.52.193.0/24
acl denied_destination dst 192.88.99.0/24
acl denied_destination dst 192.168.0.0/16
acl denied_destination dst 192.175.48.0/24
acl denied_destination dst 198.18.0.0/15
acl denied_destination dst 198.51.100.0/24
acl denied_destination dst 203.0.113.0/24
acl denied_destination dst 224.0.0.0/4
acl denied_destination dst 240.0.0.0/4

# IPv6 unspecified, mapped, translation, local, documentation, and multicast.
acl denied_destination dst ::/128
acl denied_destination dst ::1/128
acl denied_destination dst ::ffff:0:0/96
acl denied_destination dst 64:ff9b::/96
acl denied_destination dst 64:ff9b:1::/48
acl denied_destination dst 100::/64
acl denied_destination dst 2001::/23
acl denied_destination dst 2001:db8::/32
acl denied_destination dst 2002::/16
acl denied_destination dst fc00::/7
acl denied_destination dst fe80::/10
acl denied_destination dst ff00::/8
# Explicit metadata aliases are also covered by the containing ranges.
acl denied_destination dst 169.254.169.254/32
acl denied_destination dst 100.100.100.200/32
acl denied_destination dst fd00:ec2::254/128

http_access deny !worker_clients
http_access deny !connect_method
http_access deny !tls_port
http_access deny denied_destination
http_access allow worker_clients
http_access deny all

# Tunnel only: no response caching, target-bearing logs, or forwarded identity.
cache deny all
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
forwarded_for delete
via off
request_header_access Proxy-Authorization deny all
shutdown_lifetime 2 seconds

include /etc/squid/conf.d/*.conf
