groups:
  - name: webhook-platform-alerts
    rules:
      - alert: WebhookQueueAgeSLOBreach
        expr: webhook:queue_oldest_due_age_seconds:max > 30
        for: 5m
        labels: {severity: page}
        annotations:
          summary: Oldest runnable webhook exceeds 30 seconds
      - alert: WebhookDeliveryFailureSpike
        expr: sum(rate(webhook_delivery_failures_total[5m])) > 5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Webhook delivery failures are elevated
      - alert: WebhookStaleFinalization
        expr: increase(webhook_delivery_lifecycle_total{action="finalize",outcome="stale"}[5m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: A stale worker attempted finalization
      - alert: WebhookDatabasePoolSaturation
        expr: webhook:db_pool_utilization:max > 0.85
        for: 5m
        labels: {severity: page}
        annotations:
          summary: Application database pool is above 85 percent
      - alert: WebhookPostgresDeadTuplesGrowing
        expr: max(pg_stat_user_tables_n_dead_tup) > 100000
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: PostgreSQL dead tuples require investigation
